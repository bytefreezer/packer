# ByteFreezer Packer Configuration — Docker-ready defaults
#
# This config ships inside the Docker image. Secrets (S3 credentials,
# control API key) are empty and MUST be supplied via environment variables
# or a volume-mounted config file override.

app:
  name: packer
  version: 1.0.0

logging:
  level: info
  encoding: console

server:
  api_port: 8083

bytefreezer:
  spool_path: /var/spool/packer
  cache_path: /var/cache/packer

# Control Service configuration
control_service:
  enabled: true
  control_url: ""
  api_key: ""
  account_id: ""
  timeout_seconds: 30

# S3 source (processed data from piper)
s3source:
  bucket_name: "piper"
  region: "us-east-1"
  access_key: ""
  secret_key: ""
  endpoint: "minio:9000"
  ssl: false
  use_iam_role: false

# OpenTelemetry
otel:
  enabled: false
  metrics_port: 9093
  metrics_host: "0.0.0.0"

housekeeping:
  enabled: true
  interval_seconds: 300
  cleanup:
    enabled: true
    processing_dir_max_age_hours: 2
    orphaned_files_max_age_hours: 24
    lock_cleanup:
      enabled: true
      stale_threshold_minutes: 5

soc:
  enabled: false
  endpoint: ""
  timeout_seconds: 30

uploadpool:
  worker_count: 5
  cleanup_source_files: true

# Parquet processing
parquet:
  max_file_size_mb: 64
  timeout_seconds: 1200
  compression: "zstd"
  keep_source: false
  streaming_mode: true
  memory_buffer_mb: 64
  checkpoint_records: 100000
  atomic_upload: true

# Health reporting to control plane
health_reporting:
  enabled: true
  report_interval: 30
  timeout_seconds: 10
  register_on_startup: true

# Error tracking
error_tracking:
  enabled: true

dev: false
