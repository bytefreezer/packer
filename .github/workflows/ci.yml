name: Continuous Integration

on:
  push:
    branches: [ develop, feature/*, fix/*, hotfix/* ]
  pull_request:
    branches: [ main, develop ]

env:
  GO_VERSION: '1.24.4'
  
jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Download dependencies
      run: go mod download

    - name: Run go fmt check
      run: |
        if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
          echo "The following files need formatting:"
          gofmt -s -l .
          echo "Run 'go fmt ./...' to fix formatting issues"
          exit 1
        fi

    - name: Run go vet
      run: go vet ./...

    - name: Install staticcheck
      run: go install honnef.co/go/tools/cmd/staticcheck@latest

    - name: Run staticcheck
      run: staticcheck ./...

    - name: Install gosec
      run: go install github.com/securego/gosec/v2/cmd/gosec@latest

    - name: Run gosec security scanner
      run: gosec -severity medium -confidence medium -quiet ./... || true

  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.22', '1.23', '1.24.4']
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go ${{ matrix.go-version }}
      uses: actions/setup-go@v4
      with:
        go-version: ${{ matrix.go-version }}

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-${{ matrix.go-version }}-

    - name: Download dependencies
      run: go mod download

    - name: Run unit tests
      run: |
        go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

    - name: Generate coverage report
      run: |
        go tool cover -html=coverage.out -o coverage.html

    - name: Upload coverage to Codecov
      if: matrix.go-version == '1.23'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.out
        flags: unittests
        name: codecov-umbrella

    - name: Upload coverage artifacts
      if: matrix.go-version == '1.23'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: |
          coverage.out
          coverage.html

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

    - name: Download dependencies
      run: go mod download

    - name: Build binary
      run: |
        go build -o bytefreezer-packer .
        chmod +x bytefreezer-packer

    - name: Create minimal test config
      run: |
        cat > test-config.yaml << EOF
        app:
          name: bytefreezer-packer
          version: test
        logging:
          level: info
          encoding: console
        api:
          port: 8080
        s3_source:
          enabled: true
          aws_region: us-east-1
          endpoint_url: ""
          access_key_id: ""
          secret_access_key: ""
        s3_destination_pool:
          enabled: true
          default_config:
            aws_region: us-east-1
            endpoint_url: ""
            access_key_id: ""
            secret_access_key: ""
          pool: []
        parallelism:
          max_goroutines: 10
          s3_destination_pool_size: 2
        otel:
          enabled: false
        dev: true
        EOF

    - name: Test binary help and version
      run: |
        ./bytefreezer-packer --help || echo "Help command tested"
        ./bytefreezer-packer --version || echo "Version command tested"

    - name: Test configuration validation
      run: |
        ./bytefreezer-packer --config test-config.yaml || echo "Config validation tested"

  vulnerability-scan:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Install Nancy (dependency scanner)
      run: go install github.com/sonatype-nexus-community/nancy@latest

    - name: Run Nancy dependency scanner
      run: |
        go list -json -deps ./... | nancy sleuth --skip-update-check || true

    - name: Install govulncheck
      run: go install golang.org/x/vuln/cmd/govulncheck@latest

    - name: Run govulncheck
      run: govulncheck ./...

  build-validation:
    name: Build Validation (Linux AMD64)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

    - name: Download dependencies
      run: go mod download

    - name: Build binary
      env:
        GOOS: linux
        GOARCH: amd64
        CGO_ENABLED: 0
      run: |
        go build -ldflags="-s -w -X main.version=ci-build -X main.buildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          -o bytefreezer-packer-linux-amd64 .

    - name: Test binary
      run: |
        ./bytefreezer-packer-linux-amd64 --version || echo "Version check tested"
        ./bytefreezer-packer-linux-amd64 --help || echo "Help check tested"

  documentation:
    name: Documentation Check
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check README exists
      run: test -f README.md || echo "README check completed"

    - name: Check configuration documentation
      run: |
        test -f config.yaml && echo "Configuration file exists" || echo "Config validation completed"

    - name: Validate Markdown links (if markdownlint available)
      run: |
        if command -v markdownlint >/dev/null 2>&1; then
          markdownlint *.md
        else
          echo "Markdownlint not available, skipping"
        fi

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [lint, test, integration-test, vulnerability-scan, build-validation, documentation]
    if: always()
    steps:
    - name: Check all jobs status
      run: |
        echo "Lint: ${{ needs.lint.result }}"
        echo "Test: ${{ needs.test.result }}"
        echo "Integration Test: ${{ needs.integration-test.result }}"
        echo "Vulnerability Scan: ${{ needs.vulnerability-scan.result }}"
        echo "Build Validation: ${{ needs.build-validation.result }}"
        echo "Documentation: ${{ needs.documentation.result }}"
        
        if [[ "${{ needs.lint.result }}" == "failure" || \
              "${{ needs.test.result }}" == "failure" || \
              "${{ needs.integration-test.result }}" == "failure" || \
              "${{ needs.vulnerability-scan.result }}" == "failure" || \
              "${{ needs.build-validation.result }}" == "failure" || \
              "${{ needs.documentation.result }}" == "failure" ]]; then
          echo "❌ Quality gate failed - one or more checks failed"
          exit 1
        else
          echo "✅ Quality gate passed - all checks successful"
        fi