# ByteFreezer Packer Configuration — AWX/Ansible deployment
#
# This file contains AWX placeholder values for systemd/Ansible deployments.
# Ansible replaces REPLACE_WITH_AWX_VARIABLE_* at deploy time.
# For Docker deployments, use config.yaml instead.

app:
  name: bytefreezer-packer
  version: 1.0.0

logging:
  level: info
  encoding: console

server:
  api_port: 8083

bytefreezer:
  spool_path: /var/spool/bytefreezer-packer
  cache_path: /var/cache/bytefreezer-packer

control_service:
  enabled: true
  control_url: "REPLACE_WITH_AWX_VARIABLE_bytefreezer_control_url"
  api_key: "REPLACE_WITH_AWX_VARIABLE_bytefreezer_api_key"
  account_id: "REPLACE_WITH_AWX_VARIABLE_bytefreezer_account_id"
  timeout_seconds: 30

s3source:
  bucket_name: "bytefreezer-piper"
  region: "us-east-1"
  access_key: "REPLACE_WITH_AWX_VARIABLE_bytefreezer_s3_access_key"
  secret_key: "REPLACE_WITH_AWX_VARIABLE_bytefreezer_s3_secret_key"
  endpoint: "REPLACE_WITH_AWX_VARIABLE_bytefreezer_s3_endpoint"
  ssl: false
  use_iam_role: false

otel:
  enabled: true
  metrics_port: 9093
  metrics_host: "0.0.0.0"

housekeeping:
  enabled: true
  interval_seconds: 60
  cleanup:
    enabled: true
    processing_dir_max_age_hours: 2
    orphaned_files_max_age_hours: 24
    lock_cleanup:
      enabled: true
      stale_threshold_minutes: 5

soc:
  enabled: false
  endpoint: ""
  timeout_seconds: 30

uploadpool:
  worker_count: 5
  cleanup_source_files: true

parquet:
  max_file_size_mb: 64
  timeout_seconds: 1200
  compression: "zstd"
  keep_source: false
  streaming_mode: true
  memory_buffer_mb: 64
  checkpoint_records: 100000
  atomic_upload: true

health_reporting:
  enabled: true
  report_interval: 30
  timeout_seconds: 10
  register_on_startup: true

error_tracking:
  enabled: true

dev: false
